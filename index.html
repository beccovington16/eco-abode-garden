<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eco.Abode Open Garden</title>
  <meta name="description" content="A guide to the Eco.Abode garden for visitors to the Castlemaine Festival of Gardens.">
  <meta name="theme-color" content="#3b5e2b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <p class="loading">Loading the garden…</p>
  </main>

  <dialog id="plant-sheet" class="sheet" aria-labelledby="plant-sheet-name">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <div>
        <h2 id="plant-sheet-name"></h2>
        <p class="botanical" id="plant-sheet-botanical"></p>
      </div>
      <button class="sheet-close" type="button" aria-label="Close">✕</button>
    </div>
    <div id="plant-sheet-body"></div>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>

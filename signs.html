<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garden Sign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* The A4 welcome sign for the gate. Its QR code always points at the live site. */
    @page { size: A4 portrait; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ddd; color: #2b2118; font-family: 'Open Sans', system-ui, sans-serif; }
    .controls { max-width: 210mm; margin: 16px auto; padding: 0 12px; font-size: 15px; line-height: 1.5; }
    .controls button { font: 600 15px 'Open Sans', sans-serif; padding: 10px 18px; border: 0; border-radius: 10px; background: #3b5e2b; color: #fff; cursor: pointer; }
    .sign {
      width: 210mm; height: 297mm; margin: 0 auto 16px; padding: 22mm 20mm 16mm;
      background: #faf6ee; display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .brand { font: 600 46pt/1 'Poppins', sans-serif; color: #3b5e2b; letter-spacing: .5px; }
    .name { font: 600 30pt/1.15 'Poppins', sans-serif; margin: 10mm 0 0; }
    .scan { margin: auto 0; display: flex; flex-direction: column; align-items: center; }
    .qr { width: 125mm; padding: 6mm; background: #fff; border-radius: 6mm; }
    .qr svg { display: block; width: 100%; height: auto; }
    .cta { font: 600 18pt 'Open Sans', sans-serif; margin: 7mm 0 0; color: #2f4a22; }
    .small { font-size: 10pt; color: #5c5245; margin-top: 3mm; word-break: break-all; }
    @media print {
      body { background: none; }
      .controls { display: none; }
      .sign { margin: 0; }
    }
  </style>
</head>
<body>
  <div class="controls">
    <p>The welcome sign for the gate. In the print dialog choose <b>A4</b> paper and turn off headers and footers.</p>
    <button onclick="window.print()">Print sign</button>
  </div>

  <section class="sign">
    <div class="brand">Eco.Abode</div>
    <h1 class="name">Welcome to our garden</h1>
    <div class="scan">
      <div class="qr" id="qr"></div>
      <p class="cta">Scan for the map and garden guide</p>
      <p class="small" id="url"></p>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
    // The QR code always opens the live site, wherever this page is opened or printed from.
    // Change this if the site moves to a new address (e.g. your own domain).
    const LIVE_SITE = 'https://beccovington16.github.io/eco-abode-garden/';
    const base = new URLSearchParams(location.search).get('url') || LIVE_SITE;

    const qr = qrcode(0, 'M');
    qr.addData(base);
    qr.make();
    document.getElementById('qr').innerHTML = qr.createSvgTag(8, 0);
    document.getElementById('url').textContent = base;
  </script>
</body>
</html>

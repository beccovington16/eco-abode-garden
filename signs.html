<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garden Signs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* One A5 sign per page. Print from the live site so the QR codes point at the real address. */
    @page { size: A5 portrait; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ddd; color: #2b2118; font-family: 'Open Sans', system-ui, sans-serif; }
    .controls { max-width: 148mm; margin: 16px auto; font-size: 15px; line-height: 1.5; }
    .controls button { font: 600 15px 'Open Sans', sans-serif; padding: 10px 18px; border: 0; border-radius: 10px; background: #3b5e2b; color: #fff; cursor: pointer; }
    .warning { background: #fff3cd; color: #6b4e00; padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; }
    .sign {
      width: 148mm; height: 210mm; margin: 0 auto 16px; padding: 14mm 14mm 12mm;
      background: #faf6ee; display: flex; flex-direction: column; align-items: center; text-align: center;
      page-break-after: always; break-after: page;
    }
    .brand { font: 500 13pt 'Poppins', sans-serif; color: #3b5e2b; letter-spacing: .5px; }
    .number {
      margin-top: 8mm; width: 30mm; height: 30mm; border-radius: 50%;
      display: grid; place-items: center; background: #3b5e2b; color: #faf6ee;
      font: 600 40pt/1 'Poppins', sans-serif;
    }
    .name { font: 600 26pt/1.15 'Poppins', sans-serif; margin: 6mm 0 0; }
    .qr { width: 70mm; margin-top: auto; padding: 4mm; background: #fff; border-radius: 4mm; }
    .qr svg { display: block; width: 100%; height: auto; }
    .cta { font: 600 14pt 'Open Sans', sans-serif; margin: 5mm 0 0; color: #2f4a22; }
    .small { font-size: 9pt; color: #5c5245; margin-top: 2mm; word-break: break-all; }
    @media print {
      body { background: none; }
      .controls { display: none; }
      .sign { margin: 0; }
    }
  </style>
</head>
<body>
  <div class="controls">
    <div class="warning" id="warning" hidden>
      You're viewing this on your own computer, so these QR codes point at <b>localhost</b> and won't work on visitors' phones.
      Open this page on the live website before printing.
    </div>
    <p>One A5 sign per stop, plus one for the gate. In the print dialog choose <b>A5</b> paper and turn off headers and footers.</p>
    <button onclick="window.print()">Print signs</button>
  </div>
  <div id="signs"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="content.js"></script>
  <script>
    const base = location.href.split('#')[0].split('?')[0].replace(/signs\.html$/, '');
    if (['localhost', '127.0.0.1'].includes(location.hostname)) document.getElementById('warning').hidden = false;

    function qrSvg(url) {
      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      return qr.createSvgTag(8, 0);
    }

    function sign({ number, name, url, cta }) {
      return `
        <section class="sign">
          <div class="brand">Eco.Abode</div>
          <div class="number">${number}</div>
          <h1 class="name">${name}</h1>
          <div class="qr">${qrSvg(url)}</div>
          <p class="cta">${cta}</p>
          <p class="small">${url}</p>
        </section>`;
    }

    loadGarden().then(({ stops }) => {
      const gate = sign({ number: '★', name: 'Welcome to our garden', url: base, cta: 'Scan for the map and garden guide' });
      const stopSigns = stops.map((s) => sign({
        number: s.number,
        name: s.name,
        url: `${base}#/stop/${s.slug}`,
        cta: 'Scan to read about this spot',
      }));
      document.getElementById('signs').innerHTML = gate + stopSigns.join('');
    });
  </script>
</body>
</html>
